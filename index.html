<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#142f32"><title>Island RPG — はじまりの島</title><link rel="stylesheet" href="./style.css"></head>
<body>
<main>
<header><a class="brand" href="./">ISLAND <span>RPG</span></a><span class="badge">PROTOTYPE · 01</span></header>
<section class="intro"><p class="eyebrow">A SMALL ISLAND, A NEW ADVENTURE</p><h1>はじまりの島</h1><p>潮風の向こうへ、最初の一歩。</p></section>
<section class="game" aria-label="島の探索"><div class="gamebar"><span><i></i> はじまりの草原</span><span>DAY 01 ☀</span></div><div class="viewport"><canvas id="world" width="384" height="256" aria-label="草原に立つ主人公。下の方向ボタンまたは矢印キーで移動できます">Canvasを利用できません。対応ブラウザで開いてください。</canvas><div id="notice" role="status">島を準備しています…</div><div class="location">SOUTH SHORE / 南の浜辺</div></div><div class="gamefoot"><span>◆ <b>旅人</b> <span class="muted">Lv. 1</span></span><span id="position">座標 12, 8</span></div></section>
<section class="controls"><div class="guide"><p class="eyebrow">EXPLORE AT YOUR OWN PACE</p><h2>まずは、歩いてみよう。</h2><p>草原を自由に探索できます。<br>海や木のある場所には進めません。</p><p class="keyboard"><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> / WASD で移動</p><button id="reset" class="reset">↺ スタート位置へ</button></div><div class="dpad" role="group" aria-label="移動操作"><button data-dir="up" aria-label="上に移動">▲</button><button data-dir="left" aria-label="左に移動">◀</button><span aria-hidden="true">✦</span><button data-dir="right" aria-label="右に移動">▶</button><button data-dir="down" aria-label="下に移動">▼</button></div></section>
<footer><span>ISLAND RPG</span><span>小さな冒険は、ここから。</span></footer>
</main><noscript><p class="error">ゲームを起動するにはJavaScriptを有効にしてください。</p></noscript><script type="module" src="./src/game.js"></script>
</body></html>
